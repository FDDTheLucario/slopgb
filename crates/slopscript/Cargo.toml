[package]
name = "slopscript"
description = "Std-only, dep-free scripting language for headless slopgb runs (lexer/parser/interpreter, no emulator types)."
# Concrete (not workspace-inherited) so the crate directory is liftable into any
# project by copy-paste — that portability is the whole point of this crate.
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license.workspace = true

[dependencies]
# Intentionally empty. std only, forever. See lib.rs `forbid(unsafe_code)`.

[lints]
workspace = true
