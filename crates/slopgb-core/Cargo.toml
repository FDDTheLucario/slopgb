[package]
name = "slopgb-core"
description = "Cycle-accurate Game Boy / Game Boy Color emulator core. No external dependencies (std only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
# No external (crates.io) deps — std only. The one path dependency is in-tree:
# core emulates no SNES chip, so it takes nothing of the SPC700/S-DSP from here
# and imports only the shared save-state plumbing (`state::{Reader, Writer}` +
# `StateError`, re-exported in lib.rs) so core and the SNES-side crates serialize
# through one format. Also std-only + forbid(unsafe_code).
slopgb-snes-apu = { path = "../slopgb-snes-apu" }

[lints]
workspace = true
